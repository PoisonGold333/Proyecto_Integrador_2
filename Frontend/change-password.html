<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Cambiar Contraseña</h1>
        <form id="changePasswordForm">
            <input 
                type="email" 
                id="resetEmail" 
                placeholder="Correo electrónico" 
                required 
                readonly
            />
            <input 
                type="password" 
                id="newPassword" 
                placeholder="Nueva contraseña" 
                required 
                minlength="6"
            />
            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirmar contraseña" 
                required 
                minlength="6"
            />
            <button type="submit">Cambiar Contraseña</button>
        </form>
        <div id="messageContainer" style="display: none;">
            <p class="success-message">Contraseña actualizada correctamente</p>
            <p>Serás redirigido al login en <span id="countdown">5</span> segundos...</p>
        </div>
        <p><a href="login.html">Volver al inicio de sesión</a></p>
    </div>
    <script type="module" src="src/auth/change-password.js"></script>
</body>
</html>
